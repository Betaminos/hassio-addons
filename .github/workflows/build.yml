name: Build add-on images

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 4 * * *"   # daily self-heal pass (UTC)
  workflow_dispatch:
    inputs:
      addon:
        description: "Add-on folder to force-build (empty = build only unpublished versions)"
        required: false
        default: ""

concurrency:
  # Serialize builds: a newer push cancels the in-flight run (which by
  # design has not committed its version yet), so two runs can never
  # both compute the same next version and race each other. A cancelled
  # run is harmless: the next run's self-heal check rebuilds anything
  # whose advertised version never made it to GHCR.
  group: addon-build
  cancel-in-progress: true

jobs:
  build:
    # Native ARM64 runners are free for PUBLIC repositories. Add-ons build
    # sequentially in this single job; parallel matrix legs would race their
    # version-bump commits against each other.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    permissions:
      contents: write   # push the version-bump commit back to the branch
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # history needed to diff against the previous push

      # Buildx and GHCR login run BEFORE the add-on listing: the self-heal
      # check below needs both to inspect published image tags.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine which add-ons to build
        id: list
        run: |
          set -eu
          INPUT="${{ github.event.inputs.addon }}"
          ADDONS=""

          # 1) Force-build via workflow_dispatch input. Normalize whitespace
          #    and keep the same trailing-space format as the other
          #    sources, so the appends below stay space-separated.
          if [ -n "$INPUT" ]; then
            ADDONS="$(echo $INPUT) "

          # 2) Add-ons changed by this push. An un-diffable push (new branch)
          #    adds nothing here — the self-heal loop below covers anything
          #    that is actually missing.
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              for DIR in $(git diff --name-only "$BEFORE" "${{ github.sha }}" \
                             | cut -d/ -f1 | sort -u); do
                [ -f "$DIR/config.json" ] && ADDONS="$ADDONS$DIR "
              done
            fi
          fi

          # 3) Self-heal: rebuild any add-on whose advertised version is not
          #    in GHCR — e.g. a run cancelled mid-build by a newer push.
          #    Only "not found"-class errors count as missing: on a transient
          #    registry error the add-on is left alone, otherwise a GHCR
          #    hiccup would bump and republish every version pointlessly.
          for DIR in $(find . -mindepth 2 -maxdepth 2 -name config.json \
                         -printf '%h\n' | sed 's|^\./||'); do
            VER=$(jq -r .version "$DIR/config.json")
            if ! ERR="$(docker buildx imagetools inspect \
                 "ghcr.io/${GITHUB_REPOSITORY,,}/$DIR:$VER" 2>&1 >/dev/null)"; then
              case "$ERR" in
                *"not found"*|*"unknown"*|*"does not exist"*)
                  case " $ADDONS " in *" $DIR "*) ;; *) ADDONS="$ADDONS$DIR " ;; esac
                  ;;
                *)
                  echo "::warning::Could not verify $DIR:$VER against GHCR (registry error) — not rebuilding it this run"
                  ;;
              esac
            fi
          done

          if [ -z "${ADDONS// /}" ]; then
            echo "Nothing to build — all advertised versions are published."
          else
            echo "Building:$ADDONS"
          fi
          echo "addons=$ADDONS" >> "$GITHUB_OUTPUT"

      - name: Bump versions, build and push images
        env:
          ADDONS: ${{ steps.list.outputs.addons }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          for ADDON in $ADDONS; do
            CONFIG="$ADDON/config.json"
            CURRENT=$(jq -r .version "$CONFIG")
            SUFFIX="${CURRENT#*-}"
            case "$SUFFIX" in ''|*[!0-9]*) SUFFIX=0 ;; esac
            # The Dockerfile ARG is the upstream source of truth (Renovate
            # bumps it); config.json's version only catches up in the commit
            # below. Rewind pins a digest instead — no version ARG — so fall
            # back to the upstream part of the current version for it.
            UPSTREAM=$(grep -m1 -oP '^ARG [A-Z_]*VERSION=\K\S+' "$ADDON/Dockerfile" || true)
            [ -n "$UPSTREAM" ] || UPSTREAM="${CURRENT%%-*}"
            NEW="$UPSTREAM-$((SUFFIX + 1))"
            jq --arg v "$NEW" '.version = $v' "$CONFIG" > /tmp/config.json
            mv /tmp/config.json "$CONFIG"

            # Generate the add-on changelog. Home Assistant renders
            # CHANGELOG.md from the add-on folder in this store repo on
            # the add-on page and in the update dialog; each entry links
            # the exact upstream release notes it packages.
            #
            # Fully generic: an add-on that wants linked release notes
            # declares the URL base in its Dockerfile next to its version
            # pin (CI appends the upstream version):
            #   ARG RELEASE_NOTES_URL=https://github.com/<org>/<repo>/releases/tag/v
            # Add-ons without the ARG (e.g. Rewind's digest repack) get
            # a plain repack note instead of a link.
            NAME=$(jq -r .name "$CONFIG")
            RELEASE_NOTES_URL=$(grep -m1 -oP '^ARG RELEASE_NOTES_URL=\K\S+' "$ADDON/Dockerfile" || true)
            if [ -n "$RELEASE_NOTES_URL" ]; then
              UPSTREAM_LINK="[${NAME} v${UPSTREAM}](${RELEASE_NOTES_URL}${UPSTREAM})"
            else
              UPSTREAM_LINK="repackaged upstream image (upstream publishes no release notes)"
            fi
            CHANGELOG="$ADDON/CHANGELOG.md"
            if ! grep -q "^## ${NEW} " "$CHANGELOG" 2>/dev/null; then
              TMP="$(mktemp)"
              {
                echo "# Changelog"
                echo ""
                echo "## ${NEW} — ${UPSTREAM_LINK}"
                echo ""
                tail -n +2 "$CHANGELOG" 2>/dev/null || true
              } > "$TMP"
              mv "$TMP" "$CHANGELOG"
            fi

            IMAGE="ghcr.io/${REPO,,}/$ADDON"
            echo "=== Publishing $ADDON $NEW → $IMAGE ==="
            docker buildx build \
              --platform linux/arm64 \
              --provenance=false \
              --cache-from type=gha,scope="$ADDON" \
              --cache-to type=gha,scope="$ADDON",mode=max \
              --push \
              --tag "$IMAGE:$NEW" \
              --tag "$IMAGE:latest" \
              "$ADDON"
            echo "**$ADDON $NEW** → \`$IMAGE:$NEW\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # Commit the bumped versions only after ALL images are safely in
      # GHCR, so the repo never advertises a version that cannot be pulled.
      # One commit for every bumped add-on — a single push, nothing to race.
      - name: Commit bumped versions back to the branch
        run: |
          # git add -A (not `git commit -am`): the per-add-on CHANGELOG.md
          # is a brand-new untracked file on its first build, which -a
          # would silently skip.
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing built — no version bumps to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish add-on images [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}" || true
          if ! git push origin "HEAD:${{ github.ref_name }}"; then
            echo "Branch moved during the build; version commit not pushed (images are safely in GHCR)."
          fi
